name: Bug report
description: Report a reproducible problem in Nested
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Please remove credentials and private conversation content before submitting.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open…
        2. Click…
        3. See…
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Environment
      description: OS, browser, Node.js version, and `codex --version`.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Optional. Remove secrets and personal data.
